<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Juegos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#14161f;--alt:#1c1f2b;--text:#e4e6f0;--sub:#5a607a;--accent:#8fb4ff;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;font-size:14px;line-height:1.5;display:grid;place-items:center;padding:28px}
main{width:100%;max-width:760px;display:grid;gap:14px}
a{display:grid;grid-template-columns:1fr auto;align-items:end;gap:6px 24px;padding:30px 32px;border-radius:20px;background:var(--alt);color:inherit;text-decoration:none;transition:transform .25s cubic-bezier(.2,.8,.2,1),background-color .25s}
a:hover{transform:translateY(-3px);background:color-mix(in srgb,var(--accent) 12%,var(--alt))}
a:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
h2{margin:0;font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-weight:400;font-size:56px;line-height:1}
h2 b{font-weight:400;color:var(--accent)}
p{margin:0;color:var(--sub);grid-column:1}
span{grid-row:1/3;grid-column:2;color:var(--accent);font-size:22px}
</style>
</head>
<body>
<main>
  <a href="tecleo/"><h2>tecleo<b>.</b></h2><p>Test de mecanografía con citas de filosofía e historia.</p><span aria-hidden="true">→</span></a>
  <a href="mapeo/"><h2>mapeo<b>.</b></h2><p>Escribe los países y colorea el mapa: Europa, el mundo y Europa en 1914, 1920 y 1938.</p><span aria-hidden="true">→</span></a>
  <a href="ondeo/"><h2>ondeo<b>.</b></h2><p>Test de banderas: actuales por continente y un set de históricas.</p><span aria-hidden="true">→</span></a>
</main>
</body>
</html>
