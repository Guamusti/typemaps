<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapeo · juegos</title>
<meta name="description" content="Minijuegos de geografía: más o menos, siluetas, capitales, fronteras, pistas y mapas históricos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Same family as Mapeo and the reto: palette from Mapeo's settings, serif for big moments, mono for the rest. */
:root{
  --bg:#14161f; --alt:#1c1f2b; --text:#e4e6f0; --sub:#5a607a; --accent:#8fb4ff; --err:#ff6b81;
  --line:color-mix(in srgb,var(--sub) 30%,transparent);
  --land:color-mix(in srgb,var(--sub) 30%,var(--bg));
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --display:"Instrument Serif","Iowan Old Style",Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--mono);font-size:14px;line-height:1.5;transition:background-color .45s,color .45s}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
[hidden]{display:none!important}
.wrap{max-width:860px;margin:0 auto;padding:0 24px}
.glow{position:fixed;inset:0;pointer-events:none;z-index:0}
.glow::before{content:"";position:absolute;width:60vw;height:60vw;left:-15vw;top:10%;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 10%,transparent),transparent)}
header,main{position:relative;z-index:1}
header .wrap{display:flex;align-items:center;gap:16px;padding-top:22px;padding-bottom:8px}
.mark{font-family:var(--display);font-style:italic;font-size:34px;line-height:1;text-decoration:none;letter-spacing:-.01em}
.mark b{color:var(--accent);font-weight:400}
.crumb{color:var(--sub);font-size:12px;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;white-space:nowrap}
a.crumb:hover{color:var(--text)}
.push{margin-left:auto}
.ghost{color:var(--sub);transition:color .2s;text-decoration:none}
.ghost:hover{color:var(--text)}
.score{display:flex;gap:18px;color:var(--sub);font-size:12px;white-space:nowrap}
.score b{font-family:var(--display);font-weight:400;font-size:28px;color:var(--text);margin-right:5px;line-height:1}

/* hub */
.intro{font-family:var(--display);font-size:40px;line-height:1.1;margin:30px 0 6px}
.lead{color:var(--sub);margin:0 0 22px}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-bottom:14px}
main>.games:last-child{margin-bottom:60px}
.card{display:flex;flex-direction:column;gap:6px;text-align:left;padding:18px 18px 16px;border-radius:16px;background:color-mix(in srgb,var(--alt) 75%,transparent);text-decoration:none;transition:background-color .2s,transform .2s}
.card:hover{background:var(--alt);transform:translateY(-2px)}
.card h3{margin:0;font-family:var(--display);font-weight:400;font-size:25px;line-height:1.1}
.card p{margin:0;color:var(--sub);font-size:12.5px}
.card .rec{margin-top:auto;padding-top:8px;font-size:11.5px;color:var(--accent)}
.grp-h{margin:26px 0 10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);font-weight:400}

/* game frame */
.game{margin:22px 0 60px}
.q{font-family:var(--display);font-size:34px;line-height:1.15;margin:4px 0 18px}
.q em{color:var(--accent);font-style:italic}
.panel{padding:22px 24px 24px;background:color-mix(in srgb,var(--alt) 70%,transparent);border-radius:18px}
.msg{min-height:22px;margin-top:10px;font-size:12.5px;color:var(--sub)}
.msg.bad{color:var(--err)}.msg.ok{color:var(--accent)}
.field{position:relative}
.field input{width:100%;background:transparent;border:0;border-bottom:2px solid var(--line);padding:8px 0;font-size:20px;outline:none;transition:border-color .2s}
.field input:focus{border-color:var(--accent)}
.field input::placeholder{color:var(--sub)}
.sug{position:absolute;left:0;right:0;top:100%;margin-top:6px;background:var(--alt);border-radius:12px;padding:5px;z-index:5;box-shadow:0 12px 30px -10px rgba(0,0,0,.45)}
.sug button{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:8px;color:var(--sub)}
.sug button.on,.sug button:hover{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--text)}
.seg{display:inline-flex;background:var(--alt);border-radius:12px;padding:4px;gap:2px}
.seg button{padding:6px 12px;border-radius:9px;color:var(--sub);transition:color .18s,background .18s}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--bg)}
.btn{padding:11px 20px;border-radius:12px;background:var(--accent);color:var(--bg);text-decoration:none;display:inline-block}
.btn.soft{background:var(--bg);color:var(--text)}
.end{margin-top:18px;padding:26px 24px;border-radius:18px;background:var(--alt);text-align:center}
.end .big{font-family:var(--display);font-size:52px;line-height:1}
.end .sub{color:var(--sub);font-size:12.5px;margin-top:8px}
.end .acts{display:flex;justify-content:center;gap:12px;margin-top:18px;flex-wrap:wrap}
.flag{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;box-shadow:0 0 0 1px var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{padding:6px 11px;border-radius:9px;background:color-mix(in srgb,var(--accent) 22%,var(--bg))}
.chip.miss{background:color-mix(in srgb,var(--err) 25%,var(--bg))}
.chip.left{background:transparent;border:1px dashed var(--line);color:var(--sub)}

.clock{font-variant-numeric:tabular-nums;font-size:22px;font-family:var(--display)}.clock.low{color:var(--err)}
.silbox{display:grid;place-items:center;min-height:260px;padding-bottom:12px}
.silbox svg{width:min(280px,70vw);height:auto}.silbox path{fill:var(--text);stroke:var(--text);stroke-width:.35;stroke-linejoin:round;fill-rule:evenodd;transition:fill .25s}
.silbox.hit path{fill:var(--accent);stroke:var(--accent)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.lives{display:flex;gap:6px}.lives i{width:12px;height:12px;border-radius:50%;background:var(--line)}.lives i.on{background:var(--err)}
.sublbl{color:var(--sub);margin:0}.big-q{font-family:var(--display);font-size:46px;line-height:1.1;margin:4px 0 16px;color:var(--accent)}
.olist{display:grid;gap:8px;margin-bottom:12px}
.ocard{display:grid;grid-template-columns:30px 54px minmax(0,1fr) auto;align-items:center;gap:14px;padding:10px 14px;border-radius:12px;background:var(--bg);text-align:left;transition:background-color .2s}
.ocard:hover{background:color-mix(in srgb,var(--accent) 10%,var(--bg))}
.ocard .flag{width:54px}.ocard .opos{font-family:var(--display);font-size:26px;color:var(--accent);text-align:center}
.ocard .onm{font-size:15px}.ocard .oval{color:var(--sub);font-size:12.5px;font-variant-numeric:tabular-nums;text-align:right}
.ocard.set{background:color-mix(in srgb,var(--accent) 14%,var(--bg))}
.ocard.good{background:color-mix(in srgb,var(--accent) 22%,var(--bg))}.ocard.bad{background:color-mix(in srgb,var(--err) 20%,var(--bg))}
.btn:disabled{opacity:.4;cursor:default}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:14px}
.ch-n{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:10px;background:color-mix(in srgb,var(--accent) 16%,var(--bg))}
.ch-n .flag{width:28px}.ch-n.end{background:var(--bg)}.ch-n.target{border:1px dashed var(--accent)}
.ch-a{color:var(--sub)}
.mini{width:100%;height:auto;display:block;margin-top:14px}.mini .land{fill:var(--land)}
.mini .path{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.mini .sol{fill:none;stroke:var(--err);stroke-width:1.2;stroke-dasharray:3 3}
.mini .pin{fill:var(--accent);stroke:var(--bg);stroke-width:1}.mini .dot{fill:var(--text)}
.clues{margin:0 0 16px;padding-left:22px;display:grid;gap:8px;font-size:15px}
.clues li::marker{color:var(--sub);font-size:12px}.clues b{font-weight:500;color:var(--accent)}
.cflag{display:inline-block;width:90px;vertical-align:middle;margin-left:10px}
.mappanel{padding:8px}
.gmap{width:100%;height:auto;display:block;touch-action:none;cursor:grab;border-radius:12px;background:color-mix(in srgb,var(--bg) 60%,transparent)}
.gmap .ctx{fill:color-mix(in srgb,var(--sub) 11%,var(--bg))}
.gmap .land,.gmap .mk{fill:var(--land);stroke:var(--bg);stroke-width:.5;vector-effect:non-scaling-stroke;transition:fill .3s;cursor:pointer}
.gmap .mk{stroke:var(--sub)}
.gmap .land:hover,.gmap .mk:hover{fill:color-mix(in srgb,var(--accent) 30%,var(--land))}
.gmap .off{fill:color-mix(in srgb,var(--sub) 13%,var(--bg));stroke:color-mix(in srgb,var(--sub) 20%,var(--bg));pointer-events:none}
.gmap .land:not(.off){fill:color-mix(in srgb,var(--sub) 42%,var(--bg))}
.gmap .land.on{fill:var(--accent)}.gmap .land.late{fill:color-mix(in srgb,var(--accent) 55%,var(--land))}.gmap .land.bad{fill:var(--err)}.gmap .land.miss{fill:color-mix(in srgb,var(--err) 60%,var(--bg))}.gmap .land:not(.off):hover{fill:color-mix(in srgb,var(--accent) 35%,var(--land))}
.gmap .on{fill:var(--accent)}.gmap .late{fill:color-mix(in srgb,var(--accent) 55%,var(--land))}
.gmap .bad{fill:var(--err)}.gmap .miss{fill:color-mix(in srgb,var(--err) 60%,var(--bg))}
.gmap .land.t0{fill:color-mix(in srgb,var(--sub) 30%,var(--bg))}.gmap .land.t1{fill:color-mix(in srgb,var(--sub) 42%,var(--bg))}.gmap .land.t2{fill:color-mix(in srgb,var(--sub) 54%,var(--bg))}.gmap .land.t3{fill:color-mix(in srgb,var(--sub) 36%,var(--bg))}.gmap .land.t4{fill:color-mix(in srgb,var(--sub) 48%,var(--bg))}
.gmap .land.on{fill:var(--accent)!important}
.gmap .land.ends,.gmap .mk.ends{fill:var(--text)!important}
.gmap .land.sol,.gmap .mk.sol{fill:color-mix(in srgb,var(--err) 55%,var(--bg))!important}
.chmap{margin-top:14px}
.gmap .tgt{fill:var(--text);animation:pulse .8s ease-in-out infinite alternate}
@keyframes pulse{to{fill:var(--err)}}
.flagbox{display:grid;place-items:center;padding:6px 0 16px}.flagbox .flag{width:min(300px,70vw)}
.capask{font-family:var(--display);font-size:40px;line-height:1.1;color:var(--accent);white-space:nowrap}.bm-flag:has(.capask){width:auto}
.bm-ask{display:flex;align-items:center;gap:20px;margin-bottom:14px}.bm-flag{width:130px;flex:none}
.opts4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.opts4 button{padding:14px 10px;border-radius:12px;background:var(--alt);text-align:center;transition:background-color .2s}
.opts4 button:hover:not(:disabled){background:color-mix(in srgb,var(--accent) 16%,var(--alt))}
.opts4 button.right{background:color-mix(in srgb,var(--accent) 38%,var(--bg))}.opts4 button.wrong{background:color-mix(in srgb,var(--err) 35%,var(--bg))}.opts4 button.dim{opacity:.45}
.hlbl{font-size:10px;text-anchor:middle;fill:var(--text);paint-order:stroke;stroke:var(--bg);stroke-width:2.5px;pointer-events:none;font-family:var(--mono)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pair .crumb{display:block;margin:0 0 6px 4px}
@media(max-width:620px){.opts4{grid-template-columns:1fr 1fr}.pair{grid-template-columns:1fr}}
.qz-q{margin-bottom:6px}
.qz-o{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.qz-o.wide{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.qz-o button{position:relative;display:flex;align-items:center;justify-content:center;gap:12px;padding:16px 14px;border-radius:14px;background:var(--alt);min-height:64px;font-size:15px;transition:background-color .2s,box-shadow .2s}
.qz-o.wide button{flex-direction:column;padding:14px}
.qz-o button:hover:not(:disabled){background:color-mix(in srgb,var(--accent) 16%,var(--alt))}
.qz-o button.right{background:color-mix(in srgb,var(--accent) 34%,var(--bg));box-shadow:0 0 0 2px var(--accent)}
.qz-o button.wrong{background:color-mix(in srgb,var(--err) 30%,var(--bg));box-shadow:0 0 0 2px var(--err)}
.qz-o button.dim{opacity:.45}
.qz-o .kbd{position:absolute;top:6px;left:9px;font-size:10.5px;color:var(--sub)}
.qz-o .flag{max-width:200px}.mini-flag{width:38px;flex:none}.mini-flag .flag{width:38px}
svg.duel{width:100%;max-width:200px;height:auto}svg.duel path{fill:var(--text);fill-rule:evenodd}
.ds-val{font-family:var(--display);font-size:44px;text-align:center}.ds-val b{font-weight:400;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);margin:12px 0 4px}
.ds-scale{display:flex;justify-content:space-between;color:var(--sub);font-size:11px;margin-bottom:12px}
.q .sm{font-family:var(--mono);font-size:14px;color:var(--sub)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px;margin-bottom:12px}
.thumb{position:relative;padding:6px;border-radius:12px;background:var(--alt);transition:background-color .2s,box-shadow .2s}
.thumb .gmap{pointer-events:none;cursor:pointer}.thumb .opos{position:absolute;top:8px;left:12px;font-family:var(--display);font-size:26px;color:var(--accent);z-index:2}
.thumb .ty{display:block;text-align:center;font-size:13px;min-height:18px;margin-top:4px}
.thumb.set{box-shadow:0 0 0 2px var(--accent)}.thumb.good{box-shadow:0 0 0 2px var(--accent);background:color-mix(in srgb,var(--accent) 18%,var(--alt))}.thumb.bad{box-shadow:0 0 0 2px var(--err)}
.dare{margin:18px 0 -6px;padding:12px 16px;border-radius:12px;background:color-mix(in srgb,var(--accent) 16%,var(--alt));font-size:13px}
.rival{margin-top:12px;font-family:var(--display);font-size:24px}.rival.win{color:var(--accent)}.rival.lose{color:var(--err)}
.profd{margin:6px 0 10px}.profd summary{cursor:pointer;color:var(--sub);font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:6px 0}
.prof{padding:16px 18px;border-radius:16px;background:color-mix(in srgb,var(--alt) 75%,transparent);margin-top:8px}
.prof-nums{display:flex;flex-wrap:wrap;gap:8px 22px;color:var(--sub);font-size:12px;margin-bottom:14px}.prof-nums b{font-family:var(--display);font-weight:400;font-size:28px;color:var(--text);margin-right:6px}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.ach .a{padding:9px 11px;border-radius:10px;background:var(--bg);opacity:.5}.ach .a.on{opacity:1;background:color-mix(in srgb,var(--accent) 16%,var(--bg))}
.ach .a b{display:block;font-weight:500;font-size:13px}.ach .a small{color:var(--sub);font-size:11px}.ach .a.on b{color:var(--accent)}
.hub-tools{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:4px 0 6px}.srch{flex:1;min-width:220px}
.sm-seg{padding:3px}.sm-seg button{padding:4px 10px;font-size:12.5px}.hl-r{display:flex;align-items:center;gap:16px}
.qz-kb{margin:4px 0 6px}
.tflag{object-fit:contain!important;background:transparent;box-shadow:none!important;max-height:240px;width:auto!important;max-width:min(360px,80vw)!important}
.tm-bar{position:sticky;top:8px;z-index:4;margin-bottom:14px;background:var(--alt);box-shadow:0 10px 30px -12px rgba(0,0,0,.5)}
.wall-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px;margin-bottom:6px}
.wf{margin:0;padding:8px;border-radius:12px;background:color-mix(in srgb,var(--alt) 70%,transparent);display:flex;flex-direction:column;align-items:center;gap:6px;transition:background-color .3s}
.wf img{width:100%;max-height:70px;object-fit:contain}.wf figcaption{font-size:11px;min-height:15px;text-align:center;line-height:1.25}
.wf.on{background:color-mix(in srgb,var(--accent) 22%,var(--bg))}.wf.on figcaption{color:var(--accent)}
.wf.miss{background:color-mix(in srgb,var(--err) 18%,var(--bg))}.wf.miss figcaption{color:var(--err)}
.ubflag{width:140px}.ubflag .flag{box-shadow:none}
.gmap .ubl{stroke:var(--text);stroke-width:1.2;stroke-dasharray:3 3;vector-effect:non-scaling-stroke}
.gmap .ubc{fill:var(--text);stroke:var(--bg);stroke-width:1;vector-effect:non-scaling-stroke}
.gmap .ubt{fill:var(--accent);stroke:var(--bg);stroke-width:1;vector-effect:non-scaling-stroke}.gmap .ubr{fill:none;stroke:var(--accent);stroke-width:1.5;vector-effect:non-scaling-stroke}
.bm-ask .btn{margin-left:auto;flex:none}
.flagbox.sm .flag{width:min(150px,40vw)}
.cmap{margin-top:4px}.cmap .gmap{max-height:52vh}
.gmap .city{fill:var(--err)}.gmap .cityr{fill:none;stroke:var(--err);stroke-width:1.2;vector-effect:non-scaling-stroke}
.gmap .phys{vector-effect:non-scaling-stroke;pointer-events:none}
.gmap .phys.río{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.gmap .phys.mar,.gmap .phys.lago{fill:color-mix(in srgb,var(--accent) 55%,transparent);stroke:var(--accent);stroke-width:1}
.gmap .phys.cordillera{fill:color-mix(in srgb,var(--err) 50%,transparent);stroke:var(--err);stroke-width:1}
/* más o menos */
.hl{display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center}
.hl-c{padding:18px;border-radius:16px;background:var(--bg);text-align:center;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:background-color .3s}
.hl-c .flag{max-width:180px}
.hl-c .nm{font-family:var(--display);font-size:28px;line-height:1.1}
.hl-c .val{font-variant-numeric:tabular-nums;font-size:20px;min-height:30px}
.hl-c .unit{color:var(--sub);font-size:12px}
.hl-c.good{background:color-mix(in srgb,var(--accent) 18%,var(--bg))}.hl-c.bad{background:color-mix(in srgb,var(--err) 18%,var(--bg))}
.hl-vs{font-family:var(--display);font-style:italic;color:var(--sub);font-size:22px}
.hl-btns{display:flex;flex-direction:column;gap:8px;width:100%;max-width:220px}
.hl-btns button{padding:11px;border-radius:11px;background:var(--alt);transition:background-color .2s}
.hl-btns button:hover{background:color-mix(in srgb,var(--accent) 20%,var(--alt))}
.hl-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
@media(max-width:620px){.hl{grid-template-columns:1fr;gap:10px}.hl-vs{text-align:center}.hl-c{min-height:0}.q{font-size:27px}.intro{font-size:32px}}
/* new games */
.vf-flag{display:block;width:min(200px,50vw);margin:14px auto 0}.q.vf{text-align:center}
.mini-flag.inl{display:inline-block;vertical-align:middle;margin-right:6px}
.flag.inl{display:inline-block;width:30px;vertical-align:middle;margin-right:6px}
.silask{width:130px}.silask svg{width:100%;height:auto;display:block}.silask path{fill:var(--text)}
.rv{position:relative;width:min(340px,80vw);margin:4px auto 16px}.rv .flag{width:100%}
.rv-g{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);border-radius:6px;overflow:hidden}
.rv-g i{background:var(--alt);box-shadow:inset 0 0 0 1px var(--bg);transition:opacity .35s}.rv-g i.off{opacity:0}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:560px;margin:0 auto 12px}
.mc{aspect-ratio:4/3;border-radius:10px;background:var(--alt);position:relative;overflow:hidden;padding:0;transition:background-color .2s,box-shadow .2s}
.mc::before{content:"?";position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:28px;color:var(--sub);transition:opacity .2s}
.mc-b{position:absolute;inset:0;display:grid;place-items:center;padding:8px;opacity:0;transition:opacity .2s}
.mc.up .mc-b{opacity:1}.mc.up::before{opacity:0}.mc.up{background:color-mix(in srgb,var(--accent) 12%,var(--alt))}.mc.ok{box-shadow:0 0 0 2px var(--accent)}
.mc .flag{width:100%;height:100%;box-shadow:none}.mc-n{font-size:13px;line-height:1.15;text-align:center}

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PALETTES=[
  {id:'medianoche',name:'Medianoche',c:['#14161f','#1c1f2b','#e4e6f0','#5a607a','#8fb4ff','#ff6b81']},

  {id:'mar',name:'Mar',c:['#0d2530','#123240','#d6ecef','#4f7785','#4fd6c4','#ff7a6b']},
  {id:'lavanda',name:'Lavanda',c:['#221d2e','#2c2640','#ece6f7','#74698f','#c6a0ff','#ff7096']},
  {id:'bosque',name:'Bosque',c:['#141c17','#1b2620','#dbe6d6','#5c7364','#9bd67a','#f07a5a']},
  {id:'atardecer',name:'Atardecer',c:['#2a1a24','#38222f','#fbe9dc','#8c6474','#ff8a5c','#ff4d7a']},
  {id:'nordico',name:'Nórdico',c:['#2b303b','#343b48','#e5e9f0','#6f7a8f','#88c0d0','#d9727b']},
  {id:'carbon',name:'Carbón',c:['#111111','#1b1b1b','#f2f2f2','#5c5c5c','#ffffff','#ff5c5c']},
  {id:'papel',name:'Papel',c:['#f2f0ea','#e6e3da','#26262b','#a3a097','#2f55d4','#d43d2f']},
  {id:'sakura',name:'Sakura',c:['#f7eef0','#efdfe3','#4a3540','#b99aa5','#d6457a','#8a2be2']},

  {id:'oceano',name:'Océano',c:['#0b1a2a','#10263b','#dbe8f5','#4e6a85','#5ec2ff','#ff7a85']},

  {id:'neon',name:'Neón',c:['#0d0b1a','#17142b','#f1eeff','#5d5885','#39ffb6','#ff4fa3']},
  {id:'cafe',name:'Café',c:['#1f1813','#2a211a','#eadbc8','#7d6a58','#d7b085','#e8715c']},
  {id:'pizarra',name:'Pizarra',c:['#22272e','#2d333b','#cdd9e5','#66717e','#6cb6ff','#f47067']},
  {id:'ciruela',name:'Ciruela',c:['#1d1420','#2a1c2e','#f1e4f3','#84698a','#e0a3ff','#ff8a65']},
  {id:'oliva',name:'Oliva',c:['#1b1c14','#25271c','#e6e6cf','#74775c','#c5cf6a','#e8784f']},
  {id:'contraste',name:'Contraste',c:['#000000','#111111','#ffffff','#6a6a6a','#ffd400','#ff4040']},
  {id:'arena',name:'Arena',c:['#f4ede1','#e9dfcf','#3a3128','#958676','#b85f22','#b8323a']},
  {id:'cielo',name:'Cielo',c:['#eef4fb','#dde8f5','#1f2d3d','#7d91a8','#2672d6','#d6455d']},
  {id:'lino',name:'Lino',c:['#f3f1e7','#e6e3d4','#2f3327','#8f8e78','#4f7d32','#c0503a']},
  {id:'tiza',name:'Tiza',c:['#ffffff','#f0f0f0','#111111','#8a8a8a','#1a1a1a','#e0352b']},
];
const cfg=Object.assign({palette:'medianoche',custom:PALETTES[0].c},store.get('mapeo.cfg',{}));
const col=cfg.palette==='custom'?cfg.custom:(PALETTES.find(p=>p.id===cfg.palette)||PALETTES[0]).c;
['--bg','--alt','--text','--sub','--accent','--err'].forEach((k,i)=>document.documentElement.style.setProperty(k,col[i]));
{const n=parseInt(col[0].slice(1),16);document.documentElement.style.colorScheme=(.299*(n>>16&255)+.587*(n>>8&255)+.114*(n&255))/255<.5?'dark':'light'}

/* ---------- shared pieces ---------- */
const C=RETO.c,CODES=Object.keys(C);
const REGION={eu:'Europa',af:'África',as:'Asia',na:'América del Norte',sa:'América del Sur',oc:'Oceanía'};
const FB='flags/';
const flagImg=k=>`<img class="flag" src="${FB}${k.toLowerCase()}.svg" alt="" loading="lazy">`;
const rnd=a=>a[Math.random()*a.length|0];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const NAMES=CODES.map(k=>({k,n:C[k].n,keys:[norm(C[k].n),...C[k].a]}));
function findCountry(txt,pool){const t=norm(txt);if(!t)return null;const hit=NAMES.find(x=>(!pool||pool.has(x.k))&&x.keys.includes(t));return hit?hit.k:null}
const fmtN=v=>Math.round(v).toLocaleString('es');
function fmtPop(v){
  if(v>=1e9)return (v/1e9).toLocaleString('es',{maximumFractionDigits:2})+' mil millones';
  if(v>=1e6)return (v/1e6).toLocaleString('es',{maximumFractionDigits:v>=1e7?0:1})+' millones';
  if(v>=1e3)return Math.round(v/1000).toLocaleString('es')+' mil';
  return fmtN(v);
}
const fmtKm2=v=>fmtN(v)+' km²';
const listEs=a=>a.length<2?a.join(''):a.slice(0,-1).join(', ')+' y '+a[a.length-1];
const rad=x=>x*Math.PI/180;
function dist(a,b){const [l1,p1]=a.map(rad),[l2,p2]=b.map(rad),h=Math.sin((p2-p1)/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin((l2-l1)/2)**2;return 2*6371*Math.asin(Math.sqrt(h))}

// a text box that suggests country names as you type; Enter takes the highlighted one
function countryBox(input,box,onPick,opts={}){
  let idx=-1;
  const list=()=>{const t=norm(input.value);if(!t)return [];const ex=opts.exclude?opts.exclude():new Set(),pool=opts.pool;
    const ok=x=>!ex.has(x.k)&&(!pool||pool.has(x.k));
    return NAMES.filter(x=>ok(x)&&x.keys.some(k=>k.startsWith(t))).concat(NAMES.filter(x=>ok(x)&&!x.keys.some(k=>k.startsWith(t))&&x.keys.some(k=>k.includes(t)))).slice(0,6)};
  const hide=()=>{box.hidden=true;idx=-1};
  const show=()=>{const l=list();if(!l.length){hide();return}idx=0;box.innerHTML='';l.forEach((x,i)=>{const b=document.createElement('button');b.type='button';b.textContent=x.n;b.dataset.k=x.k;if(!i)b.className='on';box.append(b)});box.hidden=false};
  input.addEventListener('input',show);
  input.addEventListener('keydown',e=>{
    const bs=[...box.children];
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){if(box.hidden)return;e.preventDefault();idx=(idx+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length;bs.forEach((b,i)=>b.classList.toggle('on',i===idx));return}
    if(e.key==='Enter'){e.preventDefault();const b=!box.hidden&&bs[idx];const k=b?b.dataset.k:findCountry(input.value,opts.pool);const raw=input.value;input.value='';hide();onPick(k,raw)}
    if(e.key==='Escape')hide();
    // Tab completes the box with the highlighted suggestion (Enter then submits it)
    if(e.key==='Tab'){const l=box.hidden?list():null;const b=!box.hidden&&bs[Math.max(0,idx)];const name=b?b.textContent:l&&l[0]?l[0].n:null;if(name&&input.value.trim()){e.preventDefault();input.value=name;hide()}}
  });
  box.addEventListener('mousedown',e=>{const b=e.target.closest('button');if(b){e.preventDefault();input.value='';hide();onPick(b.dataset.k,b.textContent)}});
  input.addEventListener('blur',()=>setTimeout(hide,120));
}
// a box that suggests from any list of strings (Tab completes, Enter answers)
function textBox(input,box,getList,onPick){
  let idx=-1;const list=()=>{const t=norm(input.value);if(!t)return [];const L=getList();return L.filter(x=>norm(x).startsWith(t)).concat(L.filter(x=>!norm(x).startsWith(t)&&norm(x).includes(t))).slice(0,6)};
  const hide=()=>{box.hidden=true;idx=-1};
  const show=()=>{const l=list();if(!l.length){hide();return}idx=0;box.innerHTML='';l.forEach((x,i)=>{const b=document.createElement('button');b.type='button';b.textContent=x;if(!i)b.className='on';box.append(b)});box.hidden=false};
  input.addEventListener('input',show);
  input.addEventListener('keydown',e=>{const bs=[...box.children];
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){if(box.hidden)return;e.preventDefault();idx=(idx+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length;bs.forEach((b,i)=>b.classList.toggle('on',i===idx));return}
    if(e.key==='Tab'){const b=!box.hidden&&bs[Math.max(0,idx)];if(b){e.preventDefault();input.value=b.textContent;hide()}}
    if(e.key==='Enter'){e.preventDefault();const v=input.value;hide();input.value='';onPick(v)}
    if(e.key==='Escape')hide()});
  box.addEventListener('mousedown',e=>{const b=e.target.closest('button');if(b){e.preventDefault();input.value=b.textContent;hide();input.focus()}});
  input.addEventListener('blur',()=>setTimeout(hide,120));
}
// how you answer the test games: tapping options, or typing with the keyboard
const INPUT={mode:store.get('mapeo.juegos.kb','opt')};
const inputSeg=()=>`<span class="seg sm-seg" id="in-seg" title="Cómo respondes en los juegos tipo test"><button type="button" data-m="opt" aria-pressed="${INPUT.mode==='opt'}">opciones</button><button type="button" data-m="kb" aria-pressed="${INPUT.mode==='kb'}">teclado</button></span>`;
function bindInputSeg(after){const el=$('#in-seg');if(!el)return;el.onclick=e=>{const b=e.target.closest('[data-m]');if(!b)return;INPUT.mode=b.dataset.m;store.set('mapeo.juegos.kb',INPUT.mode);$$('#in-seg button').forEach(x=>x.setAttribute('aria-pressed',x===b));after&&after()}}
const fieldHTML=(id,ph)=>`<div class="field"><input id="${id}" autocomplete="off" spellcheck="false" placeholder="${ph}" aria-label="${ph}"><div class="sug" id="${id}-sug" hidden></div></div>`;

/* ---------- records ---------- */
const REC=store.get('mapeo.juegos',{});
const here=()=>location.hash.slice(1).split('?')[0];
// every run is seeded, so a link can replay exactly the same questions for a friend
const RUN={seed:0,rival:null,last:null};const RNG0=Math.random;
function seedRun(seed){RUN.seed=seed;let t=seed>>>0;Math.random=()=>{t=t+0x6D2B79F5|0;let x=Math.imul(t^t>>>15,1|t);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296}}
function saveScore(key,score,higher=true){RUN.last=score;
  const e=REC[key]||(REC[key]={plays:0});const prev=e.best;
  e.plays++;e.last=score;e.hist=(e.hist||[]).concat([[Date.now(),score]]).slice(-100);
  const better=prev==null||(higher?score>prev:score<prev);if(better)e.best=score;
  store.set('mapeo.juegos',REC);return {better,prev};
}
function endCard(el,{big,sub,rec,again,extra=''}){
  const riv=RUN.rival!=null&&RUN.last!=null?`<div class="rival ${RUN.last>RUN.rival?'win':RUN.last<RUN.rival?'lose':''}">${RUN.last>RUN.rival?'¡Has ganado el reto!':RUN.last<RUN.rival?'Tu rival gana':'Empate'} · tú ${RUN.last}, rival ${RUN.rival}</div>`:'';
  el.innerHTML=`<div class="big">${big}</div><div class="sub">${sub}</div>${rec?`<div class="sub">${rec}</div>`:''}${extra}${riv}
    <div class="acts"><button class="btn" type="button" data-again>otra vez</button><button class="btn soft" type="button" data-dare>retar a alguien</button><a class="btn soft" href="#">más juegos</a></div>`;
  const seed=RUN.seed,score=RUN.last,id=here();
  el.querySelector('[data-dare]').onclick=async e=>{
    const base=location.origin.startsWith('http')&&!/claude/.test(location.host)?location.origin+location.pathname:'https://typemaps.vercel.app/mapeo/juegos.html';

const recLine=(r,unit,fmt=v=>v)=>r.better?(r.prev==null?'Primer récord':`¡Nuevo récord! Antes ${fmt(r.prev)}`):`Récord: ${fmt(r.prev)}${unit}`;

/* Más o menos: is the next country bigger or smaller? */
game({id:'mas-menos',group:'Rápidos',title:'Más o menos',desc:'¿Tiene más o menos habitantes (o superficie) que el anterior? Hasta el primer fallo.',
  rec:()=>{const a=REC['mas-menos.pop']?.best,b=REC['mas-menos.km2']?.best;return a||b?`récord: ${a??0} en población · ${b??0} en superficie`:''},
  start(main){
    let metric=store.get('mapeo.juegos.mm','pop'),streak=0,left,right,busy=false;
    const M={pop:{q:'habitantes',f:fmtPop,u:'habitantes'},km2:{q:'superficie',f:fmtKm2,u:''}};
    const pool=CODES.filter(k=>C[k].pop&&C[k].km2>0);

      <p class="q" id="mm-q"></p><div class="panel"><div class="hl"><div class="hl-c" id="mm-l"></div><div class="hl-vs">vs</div><div class="hl-c" id="mm-r"></div></div></div>
      <div class="msg" id="mm-msg">Atajos: ↑ más, ↓ menos.</div><div class="end" id="mm-end" hidden></div></div>`;
    const pickNext=from=>{for(let i=0;i<200;i++){const k=rnd(pool);if(k===from)continue;const r=C[k][metric]/C[from][metric];if(r>1.06||r<0.94)return k}return rnd(pool)};
    const card=(k,show,el)=>{el.className='hl-c';el.innerHTML=`${flagImg(k)}<div class="nm">${esc(C[k].n)}</div><div class="val">${show?M[metric].f(C[k][metric]):''}</div>`;
      if(!show){const b=document.createElement('div');b.className='hl-btns';b.innerHTML=`<button type="button" data-a="1">más ↑</button><button type="button" data-a="-1">menos ↓</button>`;el.append(b);b.onclick=e=>{const x=e.target.closest('[data-a]');if(x)answer(+x.dataset.a)}}};
    const syncTop=()=>{$$('#mm-m button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===metric));

      const b=REC['mas-menos.'+metric]?.best||0;setScore(`<span><b>${streak}</b>racha</span><span><b>${b}</b>récord</span>`)};
    const reset=()=>{streak=0;busy=false;left=rnd(pool);right=pickNext(left);card(left,true,$('#mm-l'));card(right,false,$('#mm-r'));$('#mm-end').hidden=true;$('#mm-msg').textContent='Atajos: ↑ más, ↓ menos.';$('#mm-msg').className='msg';syncTop()};
    function answer(dir){
      if(busy)return;busy=true;

      // count the number up, then move on or stop
      const v=$('#mm-r .val'),t0=performance.now();$('#mm-r .hl-btns').remove();
      const step=t=>{const p=Math.min(1,(t-t0)/650),e=1-Math.pow(1-p,3);v.textContent=M[metric].f(b*e);if(p<1)requestAnimationFrame(step);else done()};

    const key=e=>{if(e.key==='ArrowUp'){e.preventDefault();answer(1)}if(e.key==='ArrowDown'){e.preventDefault();answer(-1)}};

/* graph of land borders, for the chain game */
function bfs(a,b){const prev={[a]:null},q=[a];while(q.length){const x=q.shift();if(x===b)break;for(const y of C[x].b)if(!(y in prev)){prev[y]=x;q.push(y)}}
  if(!(b in prev))return null;const p=[];for(let x=b;x!=null;x=prev[x])p.unshift(x);return p}
const miniMap=(pts,cls='')=>`<svg class="mini ${cls}" viewBox="0 0 400 200"><path class="land" d="${RETO.land}"/>${pts}</svg>`;

/* Cadena de fronteras: from A to B stepping only through neighbours */
game({id:'cadena',group:'Pensar',title:'Cadena de fronteras',desc:'Ve de un país a otro pasando solo por países vecinos, en el menor número de pasos.',
  rec:()=>{const e=REC.cadena;return e?`${e.perfect||0} cadenas perfectas de ${e.plays}`:''},
  start(main){
    let a,b,best,chain,miss,done,V=null,VM=null,mapMode=store.get('mapeo.juegos.chm','fr');
    window._t={get best(){return best}};
    main.innerHTML=`<div class="game"><div class="hl-top"><span></span><div class="seg" id="ch-mm"><button type="button" data-m="fr">mapa con fronteras</button><button type="button" data-m="pt">solo la ruta</button><button type="button" data-m="no">sin mapa</button></div></div><p class="q" id="ch-q"></p><div class="panel">
      <div class="chain" id="ch-c"></div>${fieldHTML('ch-in','Siguiente país vecino…')}
      <div class="row"><div class="msg" id="ch-msg"></div><span><button class="ghost" id="ch-undo" type="button">deshacer</button> · <button class="ghost" id="ch-give" type="button">ver solución</button></span></div>
      <div id="ch-map"></div></div><div class="end" id="ch-end" hidden></div></div>`;
    const pool=CODES.filter(k=>C[k].b.length);
    const score=()=>{const e=REC.cadena||{};setScore(`<span><b>${e.perfect||0}</b>perfectas</span><span><b>${e.plays||0}</b>jugadas</span>`)};
    function deal(){
      for(let t=0;t<500;t++){const x=rnd(pool),y=rnd(pool);if(x===y)continue;const p=bfs(x,y);if(p&&p.length>=4&&p.length<=7){a=x;b=y;best=p;break}}
      chain=[a];miss=[];done=false;V=null;$('#ch-end').hidden=true;$('#ch-in').disabled=false;
      $('#ch-q').innerHTML=`De <em>${esc(C[a].n)}</em> a <em>${esc(C[b].n)}</em>`;
      $('#ch-msg').textContent=`Se puede en ${best.length-2} ${best.length-2===1?'paso':'pasos'} intermedios. Escribe un vecino de ${C[a].n}.`;$('#ch-msg').className='msg';draw();$('#ch-in').focus();score();
    }
    function draw(sol){
      const items=[...chain];if(done&&chain[chain.length-1]!==b)items.push(null);
      $('#ch-c').innerHTML=chain.map((k,i)=>`<span class="ch-n${i===0?' end':''}">${flagImg(k)}<span>${esc(C[k].n)}</span></span>`).join('<span class="ch-a">→</span>')+
        (chain[chain.length-1]===b?'':`<span class="ch-a">⋯</span><span class="ch-n end target">${flagImg(b)}<span>${esc(C[b].n)}</span></span>`);
      const line=(path,c)=>`<polyline class="${c}" points="${path.map(k=>C[k].w.join(',')).join(' ')}"/>`;
      let pts=(sol?line(sol,'sol'):'')+line(chain,'path')+[a,b].map(k=>`<circle class="pin" cx="${C[k].w[0]}" cy="${C[k].w[1]}" r="3.2"/>`).join('')+chain.slice(1).map(k=>`<circle class="dot" cx="${C[k].w[0]}" cy="${C[k].w[1]}" r="2"/>`).join('');
      if(mapMode==='no'){$('#ch-map').innerHTML='';return}
      if(mapMode==='pt'||!window.MAPS){$('#ch-map').innerHTML=miniMap(pts);if(mapMode==='fr')loadScript('data.js').then(()=>{V=null;draw(sol)});return}
      // the real map: shapes and borders, zoomed to the area of the puzzle; clicking a country plays it
      const eu=best.every(k=>MAPS.europe.items.some(i=>i.id===k)&&C[k].r==='eu'),M=eu?MAPS.europe:MAPS.world;
      if(!V||VM!==M||V.key!==a+b){
        V=mapView($('#ch-map'),M,{onClick:k=>{if(C[k]&&!done)pick(k)}});VM=M;V.key=a+b;
        // frame: around the label points of the shortest path (whole shapes would drag in Siberia or French Guiana)
        const pts=best.map(k=>M.items.find(i=>i.id===k)).filter(Boolean).map(i=>i.c);
        let x0=Math.min(...pts.map(p=>p[0])),x1=Math.max(...pts.map(p=>p[0])),y0=Math.min(...pts.map(p=>p[1])),y1=Math.max(...pts.map(p=>p[1]));
        let w=Math.max((x1-x0)*1.5,M.w/(eu?4:6)),h=Math.max((y1-y0)*1.5,w*M.h/M.w);w=Math.max(w,h*M.w/M.h);h=w*M.h/M.w;w=Math.min(w,M.w);h=Math.min(h,M.h);
        const box=[(x0+x1)/2-w/2,(y0+y1)/2-h/2,w,h];V=mapView($('#ch-map'),M,{onClick:k=>{if(C[k]&&!done)pick(k)},box});VM=M;V.key=a+b;

// a map you can zoom with the wheel or pinch-drag, and click
function mapView(el,M,{onClick,box,tint,onPoint}){
  const NS='http://www.w3.org/2000/svg';
  let vb=box?[...box]:[0,0,M.w,M.h];const full=[0,0,M.w,M.h];
  let h=`<svg class="gmap" viewBox="${vb.join(' ')}"><path class="ctx" d="${M.ctx}"/>`;
  M.items.forEach((it,i)=>{if(it.d)h+=`<path class="land${tint?' t'+(i*7%5):''}" data-id="${it.id}" d="${it.d}"/>`});
  for(const it of M.items)if(it.m)h+=`<circle class="mk" data-id="${it.id}" cx="${it.c[0]}" cy="${it.c[1]}"/>`;
  el.innerHTML=h+'</svg>';const svg=el.querySelector('svg');
  const setVB=()=>{svg.setAttribute('viewBox',vb.join(' '));const r=vb[2]/170;svg.querySelectorAll('.mk').forEach(c=>c.setAttribute('r',r.toFixed(2)))};setVB();
  const pt=e=>{const r=svg.getBoundingClientRect();return [vb[0]+(e.clientX-r.left)/r.width*vb[2],vb[1]+(e.clientY-r.top)/r.height*vb[3]]};
  svg.addEventListener('wheel',e=>{e.preventDefault();const [x,y]=pt(e),f=e.deltaY>0?1.2:1/1.2;const w=Math.min(full[2],Math.max(full[2]/40,vb[2]*f)),k=w/vb[2];
    vb=[x-(x-vb[0])*k,y-(y-vb[1])*k,w,vb[3]*k];setVB()},{passive:false});
  let drag=null,moved=false;
  svg.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,vb:[...vb]};moved=false;svg.setPointerCapture(e.pointerId)});
  svg.addEventListener('pointermove',e=>{if(!drag)return;const r=svg.getBoundingClientRect(),dx=(e.clientX-drag.x)/r.width*vb[2],dy=(e.clientY-drag.y)/r.height*vb[3];
    if(Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)>4)moved=true;if(moved){vb=[drag.vb[0]-dx,drag.vb[1]-dy,vb[2],vb[3]];setVB()}});
  svg.addEventListener('pointerup',e=>{const was=drag;drag=null;if(!was||moved)return;const t=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-id]');if(onPoint)onPoint(pt(e),t?t.dataset.id:null);else if(t)onClick(t.dataset.id)});
  const els=id=>svg.querySelectorAll(`[data-id="${id}"]`);
  return {cls(id,c,on=true){els(id).forEach(x=>x.classList.toggle(c,on))},
    reset(){vb=box?[...box]:[...full];setVB()},
    view(b){vb=[...b];setVB()},
    focus(id){const e=els(id)[0];if(!e)return;const b=e.getBBox(),w=Math.max(b.width,b.height,M.w/12)*2.6,hh=w*M.h/M.w;vb=[b.x+b.width/2-w/2,b.y+b.height/2-hh/2,w,hh];setVB()},
    svg};
}
function regionBox(M,ids,svgEl){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const id of ids){const e=svgEl.querySelector(`[data-id="${id}"]`);if(!e)continue;const b=e.tagName==='circle'?{x:+e.getAttribute('cx'),y:+e.getAttribute('cy'),width:0,height:0}:e.getBBox();
    // ignore far-off pieces (French Guiana makes France span the Atlantic)
    x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.width);y1=Math.max(y1,b.y+b.height)}
  const pad=20;let w=x1-x0+pad*2,h=y1-y0+pad*2;const ar=M.w/M.h;if(w/h<ar)w=h*ar;else h=w/ar;
  return [(x0+x1)/2-w/2,(y0+y1)/2-h/2,w,h];
}

/* ---------- a generic quiz: a question, a few options, rounds or lives or a clock ---------- */
// gen() returns (or resolves to) {q, opts:[{html,ok}], wide, after}
const QGENS=[];
function quizGame({id,group='Test',title,desc,gen,rounds=10,time=null,lives=null,mix=true,filters=null}){
  if(mix)QGENS.push({id,title,gen});
  game({id,group,title,desc,
    rec:()=>{const b=filters?Math.max(-1,...filters.opts.map(([v])=>REC[id+'.'+v]?.best??-1)):REC[id]?.best;if(b===-1)return '';return b!=null?(time?`mejor: ${b} en ${time} s`:lives?`mejor: ${b} seguidas`:`mejor: ${b} de ${rounds}`):''},
    start(main){
      let n,right,busy,cur,T=null,running=false,ended=false,lost=0,fv=filters?store.get('mapeo.juegos.f.'+id,filters.def):null;const RK=()=>filters?id+'.'+fv:id;
      main.innerHTML=`<div class="game"><div class="hl-top"><span class="crumb" id="qz-n"></span>${filters?`<span class="seg" id="qz-f">${filters.opts.map(([v,t])=>`<button type="button" data-f="${v}" aria-pressed="${v===fv}">${t}</button>`).join('')}</span>`:''}<span class="hl-r">${inputSeg()}${time?'<span class="clock" id="qz-t"></span>':''}${lives?'<span class="lives" id="qz-l"></span>':''}</span></div>
        <div class="qz-q" id="qz-q"></div><div class="qz-kb" id="qz-kb" hidden>${fieldHTML('qz-in','Escribe la respuesta…')}</div><div class="qz-o" id="qz-o"></div><div class="msg" id="qz-msg"></div><div class="end" id="qz-end" hidden></div></div>`;
      let kbList=[];
      textBox($('#qz-in'),$('#qz-in-sug'),()=>kbList,txt=>typed(txt));
      bindInputSeg(()=>{if(cur&&!busy)showMode()});
      const score=()=>{setScore(`<span><b>${right}</b>aciertos</span><span><b>${REC[RK()]?.best??0}</b>récord</span>`);$('#qz-n').textContent=time?'':lives?(cur&&cur.tag?cur.tag:''):`${Math.min(n+1,rounds)} de ${rounds}`;if(lives)$('#qz-l').innerHTML='<i class="on"></i>'.repeat(lives-lost)+'<i></i>'.repeat(lost)};
      async function next(){
        if(ended)return;busy=true;$('#qz-msg').textContent='';
        cur=await gen(fv);if(here()!==id||ended)return;
        $('#qz-q').innerHTML=cur.q;if(cur.mount)cur.mount($('#qz-q'));
        $('#qz-o').className='qz-o'+(cur.wide?' wide':'')+(cur.opts.length===2?' two':cur.opts.length===3?' three':'');
        $('#qz-o').innerHTML=cur.opts.map((o,i)=>`<button type="button" data-i="${i}"><span class="kbd">${i+1}</span>${o.html}</button>`).join('');busy=false;score();showMode();
      }
      // keyboard mode: the options stay hidden and you type the answer (only when every option has a name)
      const txt=o=>o.html.replace(/<[^>]*>/g,'').replace(/&amp;/g,'&').replace(/&quot;/g,'"').trim();
      function showMode(){
        const texts=cur.opts.map(txt),can=cur.kb!==false&&texts.every(Boolean);const kb=INPUT.mode==='kb'&&can;
        $('#qz-kb').hidden=!kb;$('#qz-o').hidden=kb;
        if(kb){const isC=texts.every(t=>NAMES.some(x=>x.n===t));cur.isC=isC;kbList=isC?NAMES.map(x=>x.n):[...new Set([...(cur.pool||[]),...texts])];
          $('#qz-in').disabled=false;$('#qz-in').value='';$('#qz-in').focus({preventScroll:true})}
      }
      function typed(t){
        if(busy||ended||!cur)return;const texts=cur.opts.map(txt),ri=cur.opts.findIndex(o=>o.ok),right_=texts[ri];
        let ok=norm(t)===norm(right_)||(cur.kbOk||[]).some(x=>norm(x)===norm(t));if(!ok&&cur.isC){const k=findCountry(t);ok=!!k&&C[k].n===right_}
        if(!norm(t))return;
        $('#qz-in').disabled=true;$('#qz-o').hidden=false;
        const wi=ok?ri:cur.opts.findIndex(o=>!o.ok);answer(wi,ok?null:`«${esc(t)}» no. Era <b>${esc(right_)}</b>. `);
      }
      function answer(i,typedMsg){
        if(busy||ended||!cur||!cur.opts[i])return;busy=true;if(time&&!running){running=true;T=timerBar($('#qz-t'),time,finish)}
        const ok=cur.opts[i].ok;if(ok)right++;else lost++;n++;
        $$('#qz-o button').forEach((b,j)=>{b.disabled=true;b.className=cur.opts[j].ok?'right':j===i&&!typedMsg?'wrong':'dim'});
        $('#qz-msg').innerHTML=(ok?'¡Sí! ':typedMsg||'No. ')+(cur.after||'');$('#qz-msg').className='msg '+(ok?'ok':'bad');score();
        setTimeout(()=>{if(ended||here()!==id)return;if(lives?lost>=lives:!time&&n>=rounds)finish();else next()},time?(ok?450:1300):(ok?1100:2300));
      }
      function finish(){if(ended)return;ended=true;T&&T.stop();const r=saveScore(RK(),right);score();$('#qz-n').textContent='';
        endCard($('#qz-end'),{big:time||lives?`${right}`:`${right} de ${rounds}`,sub:time?`aciertos en ${time} segundos`:lives?'aciertos antes de perder las tres vidas':title,rec:recLine(r,time||lives?'':` de ${rounds}`),again:reset})}
      function reset(){T&&T.stop();n=0;right=0;lost=0;ended=false;running=false;$('#qz-end').hidden=true;if(time)$('#qz-t').textContent=time+' s';next()}
      $('#qz-o').onclick=e=>{const b=e.target.closest('[data-i]');if(b)answer(+b.dataset.i)};
      if(filters)$('#qz-f').onclick=e=>{const b=e.target.closest('[data-f]');if(!b||b.dataset.f===fv)return;fv=b.dataset.f;store.set('mapeo.juegos.f.'+id,fv);$$('#qz-f button').forEach(x=>x.setAttribute('aria-pressed',x===b));ended=true;setTimeout(reset,0)};
      const key=e=>{if(/^[1-6]$/.test(e.key)&&document.activeElement.tagName!=='INPUT'&&$('#qz-o').hidden===false)answer(+e.key-1)};
      document.addEventListener('keydown',key);stopGame=()=>{document.removeEventListener('keydown',key);T&&T.stop();ended=true};
      reset();
    }});
}

/* Intruso */
const LANDLOCKED=new Set('AF AD AM AT AZ BY BT BO BW BF BI CF TD CZ ET HU KZ XK KG LA LS LI LU MW ML MD MN NP NE MK PY RW SM RS SK SS CH TJ TM UG UZ VA ZM ZW'.split(' '));
const pickN=(list,n)=>shuffle([...list]).slice(0,n);
quizGame({id:'intruso',title:'El intruso',desc:'Cuatro países y uno no encaja: otro continente, sin frontera, con costa… Diez rondas.',
  gen(){
    const big=CODES.filter(k=>C[k].km2>=20000);
    const kinds=[
      ()=>{const rs=['eu','af','as','sa','na','oc'];const r=rnd(rs);const same=big.filter(k=>C[k].r===r),other=big.filter(k=>C[k].r!==r);
        const g=pickN(same,3),x=rnd(other);return {g,x,why:`${C[x].n} está en ${REGION[C[x].r]}; los otros, en ${REGION[r]}`}},
      ()=>{const X=rnd(CODES.filter(k=>C[k].b.length>=3));const g=pickN(C[X].b,3);const x=rnd(big.filter(k=>k!==X&&!C[X].b.includes(k)&&C[k].r===C[X].r));if(!x)return null;
        return {g,x,why:`${C[x].n} no limita con ${C[X].n}; los otros, sí`,q:`¿Cuál <em>no</em> limita con ${esc(C[X].n)}?`}},
      ()=>{const reg=rnd(['eu','af','as','sa']);const ll=CODES.filter(k=>LANDLOCKED.has(k)&&C[k].r===reg);if(ll.length<3)return null;const g=pickN(ll,3);const x=rnd(big.filter(k=>!LANDLOCKED.has(k)&&C[k].r===reg));
        return {g,x,why:`${C[x].n} tiene costa; ${listEs(g.map(k=>C[k].n))} no tienen salida al mar`,q:'Tres no tienen salida al mar: ¿cuál sí la tiene?'}},
      ()=>{const S=big.filter(k=>C[k].ll[1]<-3),N=big.filter(k=>C[k].ll[1]>3);const south=Math.random()<.5;const g=pickN(south?S:N,3),x=rnd(south?N:S);
        return {g,x,why:`${C[x].n} está en el hemisferio ${south?'norte':'sur'}; los otros, en el ${south?'sur':'norte'}`}},
      ()=>{const many=big.filter(k=>C[k].pop>=1e8),few=big.filter(k=>C[k].pop<3e7);const g=pickN(many,3),x=rnd(few);
        return {g,x,why:`${C[x].n} tiene ${fmtPop(C[x].pop)} de habitantes; los otros, más de 100 millones`}}];
    // reject sets where another criterion would single out a different country
    const CRIT=[k=>C[k].r,k=>C[k].ll[1]<0,k=>LANDLOCKED.has(k),k=>C[k].pop>=1e8];
    const odd=(f,list)=>{const v=list.map(f);const c=new Map();v.forEach(x=>c.set(x,(c.get(x)||0)+1));if(c.size!==2)return null;const [a]=[...c].find(([,n])=>n===1)||[];return a===undefined?null:list[v.indexOf(a)]};
    let r=null;for(let t=0;t<200&&!r;t++){const c=rnd(kinds)();if(!c)continue;if(c.q){r=c;break}
      const all=[...c.g,c.x];if(CRIT.every(f=>{const o=odd(f,all);return o===null||o===c.x}))r=c}
    if(!r)r=kinds[1]()||kinds[0]();
    const all=shuffle([...r.g,r.x]);
    return {kb:false,q:`<p class="q">${r.q||'¿Cuál es el <em>intruso</em>?'}</p>`,opts:all.map(k=>opt(`<span class="mini-flag">${flagImg(k)}</span>${esc(C[k].n)}`,k===r.x)),after:esc(r.why)}}});

/* Bandera mal pintada: the real flag against copies with swapped or changed colours */
const FLAGTXT={};
const getFlag=k=>FLAGTXT[k]||(FLAGTXT[k]=fetch(`${FB}${k.toLowerCase()}.svg`).then(r=>{if(!r.ok)throw 0;return r.text()}));
const hexes=t=>{const m=new Map();for(const x of t.matchAll(/#([0-9a-f]{6}|[0-9a-f]{3})\b/gi)){let h=x[1].toLowerCase();if(h.length===3)h=h.split('').map(c=>c+c).join('');m.set(h,(m.get(h)||0)+1)}return [...m.keys()]};
const recolor=(t,map)=>t.replace(/#([0-9a-f]{6}|[0-9a-f]{3})\b/gi,(all,h)=>{h=h.toLowerCase();if(h.length===3)h=h.split('').map(c=>c+c).join('');return map[h]?'#'+map[h]:all});
const cdist=(a,b)=>{const p=h=>[0,2,4].map(i=>parseInt(h.substr(i,2),16));const x=p(a),y=p(b);return Math.hypot(x[0]-y[0],x[1]-y[1],x[2]-y[2])};
const svgURI=t=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(t);
const POOLC=['ce1126','0038a8','009639','fcd116','ffffff','000000','ff8200','75aadb','6c0b2d'];
quizGame({id:'mal-pintada',title:'Bandera mal pintada',desc:'Cuatro versiones de una bandera y solo una tiene los colores bien. Diez rondas.',
  async gen(){
    for(;;){const k=rnd(CODES);let t;try{t=await getFlag(k)}catch(e){continue}
      const cols=hexes(t);if(cols.length<2||cols.length>7)continue;
      const fakes=new Set(),out=[];
      for(let tries=0;tries<30&&out.length<3;tries++){const map={};
        // only clearly different colours, or the fake would look identical
        if(Math.random()<.5){const [a,b]=pickN(cols.slice(0,4),2);if(cdist(a,b)<140)continue;map[a]=b;map[b]=a}else{const a=rnd(cols.slice(0,4));const nc=rnd(POOLC.filter(c=>cols.every(x=>cdist(x,c)>=140)));if(!nc)continue;map[a]=nc}
        const v=recolor(t,map);if(v===t||fakes.has(v))continue;fakes.add(v);out.push(v)}
      if(out.length<3)continue;
      const opts=shuffle([opt(`<img class="flag" src="${svgURI(t)}" alt="">`,true),...out.map(v=>opt(`<img class="flag" src="${svgURI(v)}" alt="">`,false))]);
      return {q:`<p class="q">¿Cuál es la bandera correcta de <em>${esc(C[k].n)}</em>?</p>`,wide:true,opts,after:''}}
  }});

/* the world map's projection (Natural Earth, centred at 11°E), forwards and backwards, to turn a click into a place */
const WPJ={k:187.5115988579835,tx:489.24644187323713,ty:283.56520954005475,rot:11};
function wfwd(lon,lat){let l=(lon-WPJ.rot)*Math.PI/180;l=((l+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;const p=lat*Math.PI/180,p2=p*p,p4=p2*p2;
  return [WPJ.tx+WPJ.k*l*(0.8707-0.131979*p2+p4*(-0.013791+p4*(0.003971*p2-0.001529*p4))),WPJ.ty-WPJ.k*p*(1.007226+p2*(0.015085+p4*(-0.044475+0.028874*p2-0.005916*p4)))]}
function winv(X,Y){const x=(X-WPJ.tx)/WPJ.k,y=(WPJ.ty-Y)/WPJ.k;let p=y;
  for(let i=0;i<25;i++){const p2=p*p,p4=p2*p2;const f=p*(1.007226+p2*(0.015085+p4*(-0.044475+0.028874*p2-0.005916*p4)))-y;
    const df=1.007226+p2*(3*0.015085+p4*(7*-0.044475+9*0.028874*p2-11*0.005916*p4));p-=f/df;if(Math.abs(f)<1e-9)break}
  const p2=p*p,p4=p2*p2;const l=x/(0.8707-0.131979*p2+p4*(-0.013791+p4*(0.003971*p2-0.001529*p4)));
  return [l*180/Math.PI+WPJ.rot,Math.max(-90,Math.min(90,p*180/Math.PI))]}

game({id:'ubicar',group:'Con mapa',title:'¿Dónde está esta bandera?',desc:'Una bandera de un país o de un territorio: haz clic donde está. Cuanto más cerca, más puntos. Diez rondas.',
  rec:()=>{const b=Math.max(-1,...['all','pais','terr'].map(v=>REC['ubicar.'+v]?.best??-1));return b>=0?`mejor: ${b} de 10.000`:''},

    main.innerHTML=`<div class="game"><div class="hl-top"><span class="seg" id="ub-f">${[['all','todo'],['pais','países'],['terr','territorios']].map(([v,t])=>`<button type="button" data-f="${v}" aria-pressed="${v===mode}">${t}</button>`).join('')}</span><span class="crumb" id="ub-n"></span></div>

    const pool=()=>{const P=CODES.filter(k=>C[k].ll).map(k=>({k,n:C[k].n,ll:C[k].ll,img:`${FB}${k.toLowerCase()}.svg`,country:k})),T=TERR.map(t=>({k:t.k,n:t.n,ll:t.ll,img:svgURI(t.s),ar:t.ar,note:t.note}));
      return mode==='pais'?P:mode==='terr'?T:[...P,...T]};
    const score=()=>{setScore(`<span><b>${total}</b>puntos</span><span><b>${REC['ubicar.'+mode]?.best??0}</b>récord</span>`);$('#ub-n').textContent=round<10?`${round+1} de 10`:''};
    let bag=[];
    function deal(){
      done=false;if(!bag.length)bag=shuffle(pool());cur=bag.pop();
      $('#ub-flag').innerHTML=`<img class="flag" src="${cur.img}" alt="" style="object-fit:contain;${cur.ar?'aspect-ratio:'+cur.ar:''}">`;
      $('#ub-q').textContent='¿Dónde está?';$('#ub-msg').textContent='Haz clic en el mapa. Rueda para acercar, arrastra para mover.';$('#ub-msg').className='msg';$('#ub-next').hidden=true;
      V=mapView($('#ub-map'),MAPS.world,{onClick(){},onPoint:click});score();
    }
    function click([x,y],id){
      if(done)return;done=true;
      const ll=winv(x,y);let d=dist(ll,cur.ll);if(cur.country&&id===cur.country)d=0;
      const pts=Math.round(1000*Math.exp(-d/1500));total+=pts;round++;
      const [tx,ty]=wfwd(...cur.ll);
      if(cur.country)V.cls(cur.country,'on');
      V.svg.insertAdjacentHTML('beforeend',`<line class="ubl" x1="${x}" y1="${y}" x2="${tx}" y2="${ty}"/><circle class="ubc" cx="${x}" cy="${y}" r="2.2"/><circle class="ubt" cx="${tx}" cy="${ty}" r="3"/><circle class="ubr" cx="${tx}" cy="${ty}" r="8"/>`);
      $('#ub-q').textContent=cur.n;
      $('#ub-msg').innerHTML=(d<1?'¡Justo ahí! ':`A ${fmtN(d)} km. `)+`+${pts}`+(cur.note?` · ${esc(cur.note)}`:'');$('#ub-msg').className='msg '+(pts>=700?'ok':'bad');
      score();$('#ub-next').hidden=false;$('#ub-next').textContent=round<10?'siguiente →':'ver resultado';$('#ub-next').focus({preventScroll:true});
    }
    $('#ub-next').onclick=()=>{if(round<10){deal();return}
      const r=saveScore('ubicar.'+mode,total);score();$('#ub-next').hidden=true;endCard($('#ub-end'),{big:`${fmtN(total)}`,sub:'puntos de 10.000',rec:recLine(r,'',fmtN),again:reset})};
    function reset(){round=0;total=0;bag=[];$('#ub-end').hidden=true;deal()}
    $('#ub-f').onclick=e=>{const b=e.target.closest('[data-f]');if(!b||b.dataset.f===mode)return;mode=b.dataset.f;store.set('mapeo.juegos.f.ubicar',mode);$$('#ub-f button').forEach(x=>x.setAttribute('aria-pressed',x===b));reset()};
    reset();
  }});



/* ===================== Speedrun Europa ===================== */
// The 47 of the usual speedrun quiz (Sporcle "Countries of Europe"): the 44 European states plus Kosovo, Cyprus and Turkey.
const SR_PARTS=[['nor','Nórdicos','IS NO SE FI DK EE LV LT'],['oes','Oeste','PT ES AD FR MC GB IE BE NL LU'],['cen','Centro','DE CH LI AT PL CZ SK HU'],
  ['sur','Mediterráneo','IT SM VA MT GR CY TR'],['bal','Balcanes','SI HR BA RS ME XK AL MK BG'],['est','Este','RO MD UA BY RU']].map(([id,n,l])=>({id,n,ids:l.split(' ')}));
const SR_ALL=SR_PARTS.flatMap(p=>p.ids),SR_PART_OF=Object.fromEntries(SR_PARTS.flatMap(p=>p.ids.map(k=>[k,p.id])));
// a sensible fixed route: west to east in a snake, so the map never has to be searched
const SR_ROUTE='IS IE GB PT ES AD FR MC BE NL LU DE DK NO SE FI EE LV LT PL CZ SK HU AT CH LI IT SM VA MT SI HR BA ME RS XK AL MK GR CY TR BG RO MD UA BY RU'.split(' ');
// Official run: English names only, checked like Sporcle does — case and spaces do not matter, spelling does.
const SR_NAME={AL:'Albania',AD:'Andorra',AT:'Austria',BY:'Belarus',BE:'Belgium',BA:'Bosnia and Herzegovina',BG:'Bulgaria',HR:'Croatia',CY:'Cyprus',CZ:'Czech Republic',DK:'Denmark',EE:'Estonia',
  FI:'Finland',FR:'France',DE:'Germany',GR:'Greece',HU:'Hungary',IS:'Iceland',IE:'Ireland',IT:'Italy',XK:'Kosovo',LV:'Latvia',LI:'Liechtenstein',LT:'Lithuania',LU:'Luxembourg',MT:'Malta',
  MD:'Moldova',MC:'Monaco',ME:'Montenegro',NL:'Netherlands',MK:'North Macedonia',NO:'Norway',PL:'Poland',PT:'Portugal',RO:'Romania',RU:'Russia',SM:'San Marino',RS:'Serbia',SK:'Slovakia',
  SI:'Slovenia',ES:'Spain',SE:'Sweden',CH:'Switzerland',TR:'Turkey',UA:'Ukraine',GB:'United Kingdom',VA:'Vatican City'};
// alternates: the first five were checked by hand in Sporcle's practice mode; the rest are still to check, so they start off
// [country, typed form, verified in Sporcle]
const SR_ALTS=[['GB','UK',1],['CZ','Czechia',1],['MK','Macedonia',1],['VA','Vatican',1],['BA','Bosnia Herzegovina',1],
  ['NL','Holland',0],['CZ','Czech',0],['GB','Great Britain',0],['GB','Britain',0],['TR','Türkiye',0]];
const SR_DEF=Object.fromEntries(SR_ALTS.filter(a=>a[2]).map(a=>[a[1],1]));
const srNorm=v=>v.toLowerCase().replace(/\s+/g,'');
let SR_ON={};
const srKeys=k=>[srNorm(SR_NAME[k]),...SR_ALTS.filter(([c,v])=>c===k&&SR_ON[v]).map(([,v])=>srNorm(v))];
const srShort=k=>srKeys(k).reduce((a,b)=>b.length<a.length?b:a);
const srShow=k=>SR_NAME[k];
const fmtSR=ms=>{if(ms==null)return '–';const s=ms/1000;return s<60?s.toFixed(2):Math.floor(s/60)+':'+(s%60).toFixed(2).padStart(5,'0')};
const fmtD=ms=>(ms<0?'−':'+')+(Math.abs(ms)/1000).toFixed(2);
// what a part "should" take for a given total: each country costs its shortest name plus a fixed moment to think and move on
const srWeight=k=>srShort(k).length+3;
function srTargets(goal){const W=SR_ALL.reduce((s,k)=>s+srWeight(k),0);
  return Object.fromEntries(SR_PARTS.map(p=>[p.id,goal*p.ids.reduce((s,k)=>s+srWeight(k),0)/W]))}

game({id:'speedrun-europa',group:'Speedrun',title:'Speedrun Europa',desc:'Los 47 países del test oficial de Sporcle, en inglés y con centésimas: parciales, fantasma de tu mejor marca y práctica por partes.',

  async start(main){

    const scopeIds=()=>S.mode==='part'?SR_PARTS.find(p=>p.id===S.part).ids:S.mode==='slow'?slowList().slice(0,10).map(x=>x[0]):SR_ALL;
    const key=()=>'speedrun.'+S.lang+'.'+(S.mode==='all'?'all':S.mode==='part'?'part.'+S.part:S.mode);
    const routeOrder=()=>D().pb?.order?.length===47?D().pb.order:SR_ROUTE;
    function side(){
      const tg=srTargets(S.goal),parts=S.mode==='all'||S.mode==='route'?SR_PARTS:S.mode==='part'?SR_PARTS.filter(p=>p.id===S.part):[];
      const spent=pid=>{let s=0;for(const k of got)if(SR_PART_OF[k]===pid)s+=times[k];return s};
      let h=parts.length?`<table class="sr-split"><thead><tr><th></th><th></th><th>tiempo</th><th title="Lo que corresponde a esta parte para hacer ${S.goal} s en total">obj. ${S.goal}</th><th title="${S.mode==='part'?'Tu mejor tiempo en este tramo':'Tu mejor tiempo en este tramo dentro de una partida completa'}">mejor</th></tr></thead><tbody>`+
        parts.map(p=>{const n=p.ids.filter(k=>got.has(k)).length,sp=spent(p.id),best=S.mode==='part'?D().part[p.id]:D().seg[p.id];const full=n===p.ids.length;

      if(S.mode==='slow'){const l=slowList();h+=l.length<10?`<p class="msg">Aún no hay datos: juega unas cuantas partidas completas y aquí saldrán los diez países en los que más tardas.</p>`:
        `<p class="sm">Tus diez países más lentos (media por país):</p><ol class="sr-slow">${l.slice(0,10).map(([k,v])=>`<li><span>${esc(srShow(k))}</span><b>${(v/1000).toFixed(2)} s</b></li>`).join('')}</ol>`}
      const pb=D().pb;if(S.mode==='all'||S.mode==='route'){const sob=SR_PARTS.every(p=>D().seg[p.id]!=null)?SR_PARTS.reduce((s,p)=>s+D().seg[p.id],0):null;
        h+=`<div class="sr-pb"><span>Mejor marca <b>${fmtSR(pb?.total)}</b></span><span title="La suma de tus mejores parciales: lo que harías juntando tus mejores tramos">Suma de mejores <b>${fmtSR(sob)}</b></span></div>`}
      h+=`<label class="sr-goal">Objetivo <input id="sr-goal" type="number" min="20" max="300" step="1" value="${S.goal}"> s</label>`;
      $('#sr-side').innerHTML=h;
      $('#sr-goal').onchange=e=>{const v=Math.max(20,Math.min(300,Math.round(+e.target.value||46)));S.goal=v;save();side();tips()};
    }
    function tips(){
      $('#sr-tips').innerHTML=`<p>Como en Sporcle: nombres en inglés; da igual mayúsculas y espacios (<code>sanmarino</code> vale), pero la ortografía tiene que estar bien. Cada país cuenta en cuanto está escrito, sin Enter. Esc reinicia.</p>
        <p>Ojo con <b>UK</b> y <b>Ukraine</b>: al escribir «uk» ya cuenta Reino Unido. Pon UK antes que Ukraine en tu ruta, o tendrás que volver a escribir Ukraine entero.</p>
        <p>Abreviaturas comprobadas en Sporcle:</p>
        <div class="sr-alts">${SR_ALTS.filter(a=>a[2]).map(([k,v])=>`<label><input type="checkbox" data-alt="${esc(v)}" ${SR_ON[v]?'checked':''}> <code>${esc(v)}</code> <span class="sm">= ${esc(SR_NAME[k])}</span></label>`).join('')}</div>
        <p>Sin comprobar todavía (pruébalas en el modo práctica de Sporcle y actívalas solo si funcionan):</p>
        <div class="sr-alts">${SR_ALTS.filter(a=>!a[2]).map(([k,v])=>`<label><input type="checkbox" data-alt="${esc(v)}" ${SR_ON[v]?'checked':''}> <code>${esc(v)}</code> <span class="sm">= ${esc(SR_NAME[k])}</span></label>`).join('')}</div>
        <p class="sm">Los objetivos de cada parte se reparten según lo que hay que teclear, para que sumen ${S.goal} s.</p>`;
      $$('#sr-tips [data-alt]').forEach(c=>c.onchange=()=>{if(c.checked)SR_ON[c.dataset.alt]=1;else delete SR_ON[c.dataset.alt];save();if(!running)reset()});
    }
    function view(){
      V=mapView($('#sr-map'),M,{onClick(){}});const ids=scopeIds();
      for(const it of M.items)V.cls(it.id,'off',!ids.includes(it.id));
      if(S.mode==='part'||S.mode==='slow'&&ids.length){V.view(regionBox(M,ids.filter(k=>k!=='RU'||ids.length<6),V.svg))}
    }
    function reset(){
      cancelAnimationFrame(raf);clearTimeout(pendT);pend=null;scope=new Set(scopeIds());got=new Set();times={};running=false;done=false;last=0;ri=0;
      order=[];pbT=S.mode==='all'?D().pb?.times||null:null;
      $('#sr-end').hidden=true;$('#sr-in').disabled=!scope.size;$('#sr-in').value='';$('#sr-t').textContent='0.00';$('#sr-d').textContent='';$('#sr-d').className='sr-delta';
      $('#sr-n').textContent=`0/${scope.size}`;view();side();tips();
      $('#sr-msg').className='msg';
      $('#sr-msg').textContent=S.mode==='route'?'Escribe los países en el orden marcado (tu ruta de la mejor marca, o una de oeste a este).':S.mode==='slow'?'Solo tus diez países más lentos: a por ellos.':'El reloj arranca con la primera tecla. Esc para reiniciar.';
      if(S.mode==='route'){V.cls(routeOrder()[0],'next')}
      $('#sr-in').focus({preventScroll:true});
    }
    const tick=()=>{if(!running)return;const ms=performance.now()-t0;$('#sr-t').textContent=fmtSR(ms);raf=requestAnimationFrame(tick)};
    function accept(k,now){
times[k]=now-last;last=now;got.add(k);order.push(k);V.cls(k,'on');V.cls(k,'next',false);
      (S.stats[k]=S.stats[k]||[]).push(Math.round(times[k]));if(S.stats[k].length>12)S.stats[k].shift();
      $('#sr-n').textContent=`${got.size}/${scope.size}`;
      if(pbT&&pbT[got.size-1]!=null){const d=now-pbT[got.size-1];$('#sr-d').textContent=fmtD(d);$('#sr-d').className='sr-delta '+(d<=0?'ok':'bad')}
      if(S.mode==='route'){ri++;const nx=routeOrder()[ri];if(nx)V.cls(nx,'next')}
      side();if(got.size===scope.size)finish();
    }
    function finish(){
      running=false;done=true;cancelAnimationFrame(raf);const total=last;$('#sr-t').textContent=fmtSR(total);$('#sr-in').disabled=true;save();
      const r=saveScore(key(),Math.round(total),false);const d=D();let extra='';
      if(S.mode==='all'){
        for(const p of SR_PARTS){const sp=p.ids.reduce((s,k)=>s+times[k],0);if(d.seg[p.id]==null||sp<d.seg[p.id])d.seg[p.id]=Math.round(sp)}
        const cum=[];let acc=0;for(const k of order){acc+=times[k];cum.push(Math.round(acc))}
        if(!d.pb||total<d.pb.total)d.pb={total:Math.round(total),times:cum,order:[...order],at:Date.now()};
      }
      if(S.mode==='part'&&(d.part[S.part]==null||total<d.part[S.part]))d.part[S.part]=Math.round(total);
      save();side();
      const slow=[...got].sort((a,b)=>times[b]-times[a]).slice(0,5);
      const tg=srTargets(S.goal);
      const goalLine=S.mode==='all'?(total<=S.goal*1000?`¡Por debajo de tu objetivo de ${S.goal} s!`:`Te faltan ${((total-S.goal*1000)/1000).toFixed(2)} s para ${S.goal} s.`):
        S.mode==='part'?(total<=tg[S.part]*1000?`Dentro del objetivo del tramo (${fmtSR(tg[S.part]*1000)} s).`:`El objetivo del tramo es ${fmtSR(tg[S.part]*1000)} s.`):'';
      endCard($('#sr-end'),{big:`${fmtSR(total)} s`,sub:`${goalLine}<br>Donde más tardaste: ${slow.map(k=>`${esc(srShow(k))} ${(times[k]/1000).toFixed(2)}`).join(' · ')}`,
        rec:r.better&&r.prev!=null?`¡Nueva mejor marca! Antes ${fmtSR(r.prev)} s`:r.prev!=null?`Tu mejor: ${fmtSR(Math.min(r.prev,total))} s`:'Primera marca guardada',again:reset});
    }
    const input=$('#sr-in');
    // A name that is also the start of a longer name of the same country ("Finland" / "Finlandia", "Bosnia" / "Bosnia y Herzegovina")
    // is held for a moment: if you keep typing that longer name it is swallowed; if you start another country, or stop, it counts.
    // The time is always the moment the first valid name was complete, so the wait costs nothing.
    const longer=(k,t)=>srKeys(k).some(x=>x.length>t.length&&x.startsWith(t));
    const settle=()=>{if(!pend)return;clearTimeout(pendT);const p=pend;pend=null;accept(p.k,p.at)};
    const hold=()=>{clearTimeout(pendT);pendT=setTimeout(()=>{input.value='';settle()},350)};
    input.addEventListener('input',()=>{
      if(done)return;
      if(!running&&input.value){running=true;t0=performance.now();raf=requestAnimationFrame(tick)}
      if(pend){const t=srNorm(input.value);
        if(t.startsWith(pend.t)&&srKeys(pend.k).some(x=>x.startsWith(t))){if(!longer(pend.k,t)){input.value='';settle()}else hold();return}
        const rest=input.value.slice(pend.raw);settle();input.value=rest.replace(/^\s+/,'')}
      const t=srNorm(input.value);if(!t)return;
      for(const k of scope){if(got.has(k))continue;if(S.mode==='route'&&k!==routeOrder()[ri])continue;
        if(srKeys(k).includes(t)){const at=performance.now()-t0;if(longer(k,t)){pend={k,t,at,raw:input.value.length};hold()}else{input.value='';accept(k,at)}return}}
    });
    input.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();reset()}else if(e.key==='Enter'){e.preventDefault();if(pend){input.value='';settle()}else if(done)reset()}});
    const seg=(id,f)=>{$(id).onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;$$(id+' button').forEach(x=>x.setAttribute('aria-pressed',x===b));f(b.dataset.v);save();reset()}};
    seg('#sr-m',v=>{S.mode=v;$('#sr-p').hidden=v!=='part'});seg('#sr-p',v=>{S.part=v});
    const esc_=e=>{if(e.key==='Escape'&&document.activeElement!==input&&here()==='speedrun-europa'){reset()}};document.addEventListener('keydown',esc_);
    stopGame=()=>{running=false;cancelAnimationFrame(raf);document.removeEventListener('keydown',esc_);save()};
    reset();
  }});

/* Verdadero o falso: a minute of quick facts */
quizGame({id:'verdadero-falso',group:'Rápidos',title:'Verdadero o falso',desc:'Capitales, fronteras, continentes, habitantes y banderas: ¿es cierto? Todas las que puedas en 60 segundos.',time:60,
  gen(){const pool=CODES.filter(k=>C[k].km2>=5000);
    for(;;){const k=rnd(pool),T=Math.random()<.5,A=esc(C[k].n);const other=f=>{const l=pool.filter(x=>x!==k&&f(x));return l.length?rnd(l):null};let s,truth=T,after;
      const kind=rnd(['cap','cap','b','b','r','pop','flag']);
      if(kind==='cap'){if(!C[k].cap)continue;const x=T?k:other(y=>C[y].cap&&C[y].r===C[k].r);if(!x)continue;s=`La capital de <em>${A}</em> es <em>${esc(C[x].cap.n)}</em>`;after=`La capital de ${A} es ${esc(C[k].cap.n)}`}
      else if(kind==='b'){if(!C[k].b.length)continue;const y=T?rnd(C[k].b):other(y=>C[y].r===C[k].r&&!C[k].b.includes(y));if(!y||!C[y])continue;s=`<em>${A}</em> limita con <em>${esc(C[y].n)}</em>`;
        after=`Vecinos de ${A}: ${esc(listEs(C[k].b.filter(z=>C[z]).map(z=>C[z].n)))}`}
      else if(kind==='r'){const r=T?C[k].r:rnd(Object.keys(REGION).filter(r=>r!==C[k].r));s=`<em>${A}</em> está en <em>${REGION[r]}</em>`;after=`${A} está en ${REGION[C[k].r]}`}
      else if(kind==='pop'){const y=other(y=>{const q=C[y].pop/C[k].pop;return q>1.3||q<.77});if(!y)continue;truth=C[k].pop>C[y].pop;s=`<em>${A}</em> tiene más habitantes que <em>${esc(C[y].n)}</em>`;
        after=`${A} ${fmtPop(C[k].pop)} · ${esc(C[y].n)} ${fmtPop(C[y].pop)}`}
      else{const y=T?k:other(y=>C[y].r===C[k].r);if(!y)continue;s=`Esta es la bandera de <em>${A}</em><span class="vf-flag">${flagImg(y)}</span>`;after=`Es la de ${esc(C[y].n)}`}
      return {kb:false,q:`<p class="q vf">${s}</p>`,opts:[opt('Verdadero',truth),opt('Falso',!truth)],after}}}});

/* Bandera revelada: the flag uncovers itself tile by tile */
game({id:'revelada',group:'Banderas',title:'Bandera revelada',desc:'La bandera se destapa casilla a casilla: adivínala cuanto antes. Diez banderas.',
  rec:()=>{const b=REC.revelada?.best;return b!=null?`mejor: ${b} de 120`:''},
  start(main){
    const N=12;let round,total,k,left,T=0,done,order,used;
    main.innerHTML=`<div class="game"><div class="hl-top"><span class="crumb" id="rv-n"></span><span class="clock" id="rv-p"></span></div>
      <div class="panel"><div class="rv" id="rv-f"></div>${fieldHTML('rv-in','¿De qué país es?')}
      <div class="row"><div class="msg" id="rv-msg"></div><button class="ghost" id="rv-skip" type="button">no lo sé →</button></div></div>
      <div class="end" id="rv-end" hidden></div></div>`;
    const pool=CODES.filter(k=>C[k].km2>=1000);
    const score=()=>{setScore(`<span><b>${total}</b>puntos</span><span><b>${REC.revelada?.best??0}</b>récord</span>`);$('#rv-n').textContent=round<10?`${round+1} de 10`:''};
    const uncover=()=>{if(left<=0)return;$$('#rv-f i')[order[N-left]].classList.add('off');left--;$('#rv-p').textContent=left+' pts'};
    function deal(){clearInterval(T);k=rnd(pool.filter(x=>!used.has(x)));used.add(k);left=N;done=false;order=shuffle([...Array(N).keys()]);
      $('#rv-f').innerHTML=flagImg(k)+'<div class="rv-g">'+'<i></i>'.repeat(N)+'</div>';$('#rv-p').textContent=N+' pts';
      // the first tile opens at once, then one more every second
      setTimeout(()=>{if(!done)uncover()},350);T=setInterval(()=>{if(!done)uncover()},1100);
      $('#rv-in').disabled=false;$('#rv-in').focus({preventScroll:true});$('#rv-msg').textContent='Cada casilla aún tapada vale un punto; fallar destapa otra.';$('#rv-msg').className='msg';score()}
    function finish(ok){done=true;clearInterval(T);$$('#rv-f i').forEach(x=>x.classList.add('off'));const pts=ok?Math.max(1,left):0;total+=pts;round++;
      $('#rv-msg').innerHTML=ok?`¡Sí! ${esc(C[k].n)} · +${pts}`:`Era <b>${esc(C[k].n)}</b>`;$('#rv-msg').className='msg '+(ok?'ok':'bad');$('#rv-in').disabled=true;score();
      setTimeout(()=>{if(here()!=='revelada')return;if(round<10)deal();else end()},ok?1100:2000)}
    countryBox($('#rv-in'),$('#rv-in-sug'),x=>{if(done)return;if(x===k)finish(true);else if(x){$('#rv-msg').innerHTML=`${esc(C[x].n)} no. Sigue…`;$('#rv-msg').className='msg bad';uncover()}});
    $('#rv-skip').onclick=()=>{if(!done)finish(false)};
    function end(){const r=saveScore('revelada',total);score();endCard($('#rv-end'),{big:`${total} de 120`,sub:'puntos por casillas sin destapar',rec:recLine(r,' de 120'),again:reset})}
    function reset(){round=0;total=0;used=new Set();$('#rv-end').hidden=true;deal()}
    stopGame=()=>{clearInterval(T);done=true};
    reset();
  }});

game({id:'por-letra',group:'Rápidos',title:'Países por letra',desc:'Una letra y 60 segundos: escribe todos los países que empiezan por ella.',

/* Ahorcado */
const base1=ch=>ch.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
game({id:'ahorcado',group:'Pensar',title:'Ahorcado',desc:'Adivina el país letra a letra con seis fallos como mucho. Uno tras otro hasta que te ahorquen.',
  rec:()=>{const b=REC.ahorcado?.best;return b!=null?`mejor: ${b} seguidos`:''},
  start(main){
    let cur,tried,miss,streak,over;const MAXM=6;
    main.innerHTML=`<div class="game"><div class="hl-top"><span class="crumb" id="ah-h"></span><span class="lives" id="ah-l"></span></div>
      <div class="panel"><div class="ah-art" id="ah-a"></div><div class="an-w ah-w" id="ah-w"></div><div class="ah-k" id="ah-k"></div><div class="msg" id="ah-msg"></div></div><div class="end" id="ah-end" hidden></div></div>`;
    const pool=CODES.filter(k=>C[k].km2>=2000);
    const letters='abcdefghijklmnopqrstuvwxyz'.split('');
    const score=()=>setScore(`<span><b>${streak}</b>seguidos</span><span><b>${REC.ahorcado?.best??0}</b>récord</span>`);
    // the gallows, drawn one stroke per mistake
    const ART=['<path d="M10 92H70"/>','<path d="M25 92V8H60"/>','<path d="M60 8V20"/>','<circle cx="60" cy="28" r="8"/>','<path d="M60 36V60"/>','<path d="M60 42L48 52M60 42L72 52"/><path d="M60 60L50 76M60 60L70 76"/>'];
    function draw(){const name=C[cur].n;
      $('#ah-w').innerHTML=[...name].map(c=>/[a-zñáéíóúü]/i.test(c)?`<b>${tried.has(base1(c))||over?esc(c.toUpperCase()):'&nbsp;'}</b>`:c===' '?'<i class="sp"></i>':`<b class="p">${esc(c)}</b>`).join('');
      $('#ah-a').innerHTML=`<svg viewBox="0 0 90 100">${ART.slice(0,miss).join('')}</svg>`;
      $('#ah-l').innerHTML='<i class="on"></i>'.repeat(MAXM-miss)+'<i></i>'.repeat(miss);
      $('#ah-h').textContent=`Pista: ${REGION[C[cur].r]}`;
      $$('#ah-k button').forEach(b=>{const l=b.dataset.l;b.disabled=over||tried.has(l);b.className=tried.has(l)?(norm(name).includes(l)?'hit':'miss'):''})}
    function deal(){cur=rnd(pool);tried=new Set();miss=0;over=false;$('#ah-msg').textContent='Pulsa letras o escríbelas con el teclado.';$('#ah-msg').className='msg';draw();score()}
    function guess(l){if(over||tried.has(l))return;tried.add(l);const name=norm(C[cur].n);if(!name.includes(l))miss++;
      const solved=[...name].every(c=>tried.has(c));
      if(solved){over=true;streak++;$('#ah-msg').innerHTML=`${flagImg(cur).replace('class="flag"','class="flag inl"')} ¡${esc(C[cur].n)}!`;$('#ah-msg').className='msg ok';draw();score();setTimeout(()=>{if(here()==='ahorcado')deal()},1400);return}
      if(miss>=MAXM){over=true;draw();const r=saveScore('ahorcado',streak);score();$('#ah-msg').innerHTML=`Era <b>${esc(C[cur].n)}</b>`;$('#ah-msg').className='msg bad';
        endCard($('#ah-end'),{big:`${streak}`,sub:`${streak===1?'país adivinado':'países adivinados'} seguidos`,rec:recLine(r,''),again:reset});return}
      draw()}
    $('#ah-k').innerHTML=letters.map(l=>`<button type="button" data-l="${l}">${l.toUpperCase()}</button>`).join('');
    $('#ah-k').onclick=e=>{const b=e.target.closest('[data-l]');if(b)guess(b.dataset.l)};
    const key=e=>{if(e.ctrlKey||e.metaKey||e.altKey||document.activeElement.tagName==='INPUT')return;const l=base1(e.key);if(/^[a-z]$/.test(l)){e.preventDefault();guess(l)}};
    document.addEventListener('keydown',key);stopGame=()=>document.removeEventListener('keydown',key);
    function reset(){streak=0;$('#ah-end').hidden=true;deal()}
    reset();
  }});

game({id:'de-cerca',group:'Pensar',title:'De cerca',desc:'Un trocito de costa o frontera que se va alejando: di qué país es antes de verlo entero. Diez rondas.',
  rec:()=>{const b=REC['de-cerca']?.best;return b!=null?`mejor: ${b} de 100`:''},
  start(main){
    let round,total,k,raf=0,t0,done,pts,box;const DUR=15000;
    main.innerHTML=`<div class="game"><div class="hl-top"><span class="crumb" id="dc-n"></span><span class="clock" id="dc-p"></span></div>
      <div class="panel"><div class="silbox dc" id="dc-s"></div>${fieldHTML('dc-in','¿Qué país es?')}

    async function deal(){cancelAnimationFrame(raf);k=rnd(pool);done=false;const d=await loadSil(k);if(here()!=='de-cerca')return;
      const P=[...d.matchAll(/(-?[\d.]+),(-?[\d.]+)/g)].map(m=>[+m[1],+m[2]]);const [cx,cy]=rnd(P);
      $('#dc-s').innerHTML=silSVG(d);const svg=$('#dc-s svg');
      t0=performance.now();const step=t=>{if(done)return;const p=Math.min(1,(t-t0)/DUR),w=200*Math.pow(1/9,1-p),x=cx+(100-cx)*p,y=cy+(100-cy)*p;
        svg.setAttribute('viewBox',`${(x-w/2).toFixed(2)} ${(y-w/2).toFixed(2)} ${w.toFixed(2)} ${w.toFixed(2)}`);pts=Math.max(1,10-Math.floor(p*10));$('#dc-p').textContent=pts+' pts';if(p<1)raf=requestAnimationFrame(step)};
      raf=requestAnimationFrame(step);
      $('#dc-in').disabled=false;$('#dc-in').focus({preventScroll:true});$('#dc-msg').textContent='Cuanto antes aciertes, más puntos. Fallar no resta.';$('#dc-msg').className='msg';score()}
    function finish(ok){done=true;cancelAnimationFrame(raf);$('#dc-s svg').setAttribute('viewBox','0 0 200 200');$('#dc-s').classList.toggle('hit',ok);setTimeout(()=>$('#dc-s').classList.remove('hit'),900);
      const p=ok?pts:0;total+=p;round++;$('#dc-msg').innerHTML=ok?`¡Sí! ${esc(C[k].n)} · +${p}`:`Era <b>${esc(C[k].n)}</b>`;$('#dc-msg').className='msg '+(ok?'ok':'bad');$('#dc-in').disabled=true;score();
      setTimeout(()=>{if(here()!=='de-cerca')return;if(round<10)deal();else{const r=saveScore('de-cerca',total);score();endCard($('#dc-end'),{big:`${total} de 100`,sub:'puntos por adivinar pronto',rec:recLine(r,' de 100'),again:reset})}},ok?1200:2000)}
    countryBox($('#dc-in'),$('#dc-in-sug'),x=>{if(done)return;if(x===k)finish(true);else if(x){$('#dc-msg').textContent=`${C[x].n} no. Sigue…`;$('#dc-msg').className='msg bad'}});
    $('#dc-skip').onclick=()=>{if(!done)finish(false)};
    function reset(){round=0;total=0;$('#dc-end').hidden=true;deal()}
    stopGame=()=>{done=true;cancelAnimationFrame(raf)};
    reset();
  }});

/* ---------- profile and achievements ---------- */
function profile(){
  const sum=Object.values(REC).reduce((a,e)=>a+(e.plays||0),0);
  const played=new Set(Object.keys(REC).map(k=>k.split('.')[0]));
  const best=(k)=>Math.max(-1,...Object.entries(REC).filter(([x])=>x===k||x.startsWith(k+'.')).map(([,e])=>e.best??-1));
  const RS=store.get('mapeo.reto.stats',{streak:0,best:0,played:0});const MR=store.get('mapeo.rec',{});
  const capsAll=k=>{const e=MR[k];return e&&e.best&&e.best.a1!=null&&e.n&&e.best.a1===e.n};
  const A=[
    ['Primer paso','Juega cualquier minijuego',sum>=1],['Curioso','Prueba 10 minijuegos distintos',played.size>=10],['Coleccionista','Prueba todos los minijuegos',GAMES.every(g=>played.has(g.id))],
    ['Constante','Racha de 7 días en el reto diario',RS.best>=7],['Imparable','Racha de 30 días en el reto diario',RS.best>=30],['Retador','Completa 20 retos diarios',RS.played>=20],
    ['Ojo de halcón','20 siluetas en un minuto',best('siluetas')>=20],['Abanderado','30 banderas en un minuto',best('banderas-reloj')>=30],['Más que menos','Racha de 20 en Más o menos',best('mas-menos')>=20],
    ['Sin rodeos','Una cadena de fronteras perfecta',(REC.cadena?.perfect||0)>=1],['Maestro de fronteras','10 cadenas perfectas',(REC.cadena?.perfect||0)>=10],['Detective','35 de 40 en Pistas',best('pistas')>=35],
    ['Europa entera','Rellena Europa al 100 %',(REC['rellena.eu']?.best||0)>=100],['Cartógrafo','15 de 15 en Bandera → mapa',best('bandera-mapa')>=15],['Brújula fina','25 en Brújula',best('brujula')>=25],
    ['Historiador','8 de 8 en ¿Qué año es?',best('que-ano')>=8],['Cronista','15 de 15 en Ordena la historia',best('ordena-historia')>=15],['Medidor','450 de 500 en Distancia',best('distancia')>=450],
    ['Maratoniano','30 aciertos en el Maratón',best('maraton')>=30],['Capitalino','Todas las capitales de Europa a la primera en Mapeo',capsAll('cape')],['Trotamundos','Todas las capitales del mundo a la primera en Mapeo',capsAll('capw')]];
  const got=A.filter(a=>a[2]).length;

    <div class="ach">${A.map(([t,d,ok])=>`<span class="a${ok?' on':''}" title="${esc(d)}"><b>${ok?'★':'☆'} ${esc(t)}</b><small>${esc(d)}</small></span>`).join('')}</div></section>`;
}

const artSVG=id=>{const f=ARTS[id]||(()=>`<g opacity=".9">${''}</g>`+ARTS._def());if(!f||!window.ART)return '';try{return `<svg viewBox="0 0 240 120" aria-hidden="true">${f()}</svg>`}catch(e){return ''}};

/* ---------- hub and routing ---------- */
const EXTRA=[{href:'reto.html',group:'Diarios',title:'Reto diario',desc:'Un país cada día: silueta, bandera, capital, población y vecinos.'},
  {href:'reto.html#libre',group:'Diarios',title:'Reto ilimitado',desc:'Lo mismo que el reto, con un país al azar cada vez.'},
  {href:'banderas.html',group:'Banderas',title:'Test de banderas',desc:'Escribe el país de cada bandera: por continentes, todas a la vez o una a una, y un set de históricas.'}];
function hub(){
  setScore('');$('#crumb-g').textContent='';
  const groups={Diarios:[],Speedrun:[]};for(const g of [...EXTRA,...GAMES])(groups[g.group]=groups[g.group]||[]).push(g);for(const k in groups)if(!groups[k].length)delete groups[k];
  let h='<p class="intro">Minijuegos</p><p class="lead">Para jugar un rato sin mapa completo. Los récords se guardan en este navegador; al acabar puedes retar a alguien con las mismas preguntas.</p>';
  h+=`<div class="hub-tools"><div class="field srch"><input id="hub-q" autocomplete="off" spellcheck="false" placeholder="Buscar un juego…" aria-label="Buscar un juego"></div>${inputSeg()}</div>`;
  h+=`<details class="profd"${store.get('mapeo.juegos.prof',0)?' open':''}><summary>Tu perfil y logros</summary>${profile()}</details>`;
  for(const [gr,list] of Object.entries(groups)){h+=`<h3 class="grp-h">${gr}</h3><div class="games">`;
    for(const g of list){const r=g.rec?g.rec():'',ak=g.id||g.href;h+=`<a class="card" href="${g.href||'#'+g.id}"><div class="art" data-a="${ak}">${artSVG(ak)}</div><h3>${g.title}</h3><p>${g.desc}</p>${r?`<span class="rec">${r}</span>`:''}</a>`}h+='</div>'}
  $('#main').innerHTML=h;
  // the drawings need the simplified maps: fetched once, then every card is filled in
  if(!window.ART)loadScript('art-data.js').then(()=>{for(const el of $$('.art[data-a]'))if(!el.firstChild)el.innerHTML=artSVG(el.dataset.a)}).catch(()=>{});
  $('.profd').addEventListener('toggle',e=>store.set('mapeo.juegos.prof',e.target.open?1:0));
  bindInputSeg();
  const q=$('#hub-q');q.addEventListener('input',()=>{const t=norm(q.value);
    for(const c of $$('.card'))c.hidden=!!t&&!norm(c.textContent).includes(t);
    for(const g of $$('.games')){const any=[...g.children].some(c=>!c.hidden);g.hidden=!any;g.previousElementSibling.hidden=!any}});
  q.addEventListener('keydown',e=>{if(e.key==='Enter'){const c=$$('.card').find(c=>!c.hidden);if(c)c.click()}});
  if(matchMedia('(pointer:fine)').matches)q.focus({preventScroll:true});
}
function route(){
  stopGame();stopGame=()=>{};Math.random=RNG0;
  const id=here(),q=new URLSearchParams(location.hash.split('?')[1]||'');
  const g=GAMES.find(x=>x.id===id);
  if(!g){hub();window.scrollTo(0,0);return}
  seedRun(+q.get('s')||(RNG0()*2**31|0));RUN.rival=q.has('p')?+q.get('p'):null;RUN.last=null;
  if(RUN.rival!=null)setTimeout(()=>{const b=document.createElement('div');b.className='dare';b.textContent=`Te han retado: ${RUN.rival} puntos con estas mismas preguntas. ¡Supéralo!`;$('#main').prepend(b)},0);
  $('#crumb-g').textContent='· '+g.title;document.title='Mapeo · '+g.title;
  g.start($('#main'));window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
route();
